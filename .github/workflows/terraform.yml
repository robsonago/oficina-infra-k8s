name: Terraform — oficina-infra-k8s

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, homolog]

env:
  GCP_PROJECT_ID: oficina-501820
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/863475645726/locations/global/workloadIdentityPools/github-actions/providers/github
  GCP_SERVICE_ACCOUNT: github-actions-ci@oficina-501820.iam.gserviceaccount.com

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  # ─────────────────────────────────────────
  # PR (para main ou homolog): mostra o que vai mudar, sem aplicar.
  # ─────────────────────────────────────────
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Autenticar no GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.6.6'

      - name: Instalar gke-gcloud-auth-plugin
        run: |
          gcloud components install gke-gcloud-auth-plugin --quiet

      - name: terraform.tfvars (valores não sensíveis do example)
        run: cp terraform.tfvars.example terraform.tfvars

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -no-color -input=false
        env:
          USE_GKE_GCLOUD_AUTH_PLUGIN: "True"

  # ─────────────────────────────────────────
  # Push em main: aplica de verdade.
  # (Este repositório provisiona um único cluster/estado compartilhado por
  # homolog e produção — não há um "apply" separado por branch/ambiente.)
  # ─────────────────────────────────────────
  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Autenticar no GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.6.6'

      - name: Instalar gke-gcloud-auth-plugin
        run: |
          gcloud components install gke-gcloud-auth-plugin --quiet

      - name: terraform.tfvars (valores não sensíveis do example)
        run: cp terraform.tfvars.example terraform.tfvars

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false
        env:
          USE_GKE_GCLOUD_AUTH_PLUGIN: "True"
