swagger: "2.0"
info:
  title: oficina-api
  description: >-
    Gateway público da aplicação oficina. Roteia todo o tráfego para o
    backend (aplicação Spring Boot no GKE) preservando o path original.
    A validação do token JWT é feita inteiramente pela própria aplicação
    (Spring Security). Dois cuidados pra isso funcionar: (1) sem
    `disable_auth: true` no x-google-backend, o ESPv2 (o proxy por trás do
    API Gateway) gera seu próprio token de identidade e sobrescreve o header
    Authorization, movendo o token do cliente pra X-Forwarded-Authorization
    — quebra 100% das rotas protegidas sem gerar nenhum erro óbvio; (2) por
    isso também não declaramos um esquema "security" tipo apiKey aqui — quais
    rotas exigem token está documentado na tabela de endpoints do README da
    aplicação principal, não neste spec.
  version: 1.0.0
schemes:
  - https
produces:
  - application/json
x-google-backend:
  address: https://136.68.30.187.nip.io
  disable_auth: true

paths:
  /api/auth/login:
    post:
      operationId: authLogin
      responses:
        "200":
          description: OK
  /api/auth/registrar:
    post:
      operationId: authRegistrar
      responses:
        "200":
          description: OK

  /api/veiculos:
