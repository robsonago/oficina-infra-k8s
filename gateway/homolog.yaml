swagger: "2.0"
info:
  title: oficina-api
  description: >-
    Gateway público da aplicação oficina. Roteia todo o tráfego para o
    backend (aplicação Spring Boot no GKE) preservando o path original.
    A validação do token JWT é feita inteiramente pela própria aplicação
    (Spring Security) — o Gateway não declara um esquema "security" porque
    o tipo apiKey (único suportado pelo Swagger 2.0 pra header customizado)
    faz o Google API Gateway consumir o header Authorization em vez de
    repassá-lo ao backend, quebrando a autenticação; o esquema atual de
    token (HMAC com chave compartilhada) também não é compatível com a
    validação nativa de JWT do API Gateway, que espera um emissor com
    chaves públicas (JWKS). Quais rotas exigem token está documentado na
    tabela de endpoints do README da aplicação principal, não aqui.
  version: 1.0.0
schemes:
  - https
produces:
  - application/json
x-google-backend:
  address: https://136.68.30.187.nip.io

paths:
