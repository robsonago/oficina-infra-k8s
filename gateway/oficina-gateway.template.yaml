          description: OK
  /api/ordens-servico/{id}/aprovacao-orcamento:
    post:
      operationId: ordensAprovarOrcamento
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, type: string}
      responses:
        "200":
          description: OK
  /api/ordens-servico/{id}/finalizar:
    post:
      operationId: ordensFinalizar
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, type: string}
      responses:
        "200":
          description: OK
  /api/ordens-servico/{id}/entregar:
    post:
      operationId: ordensEntregar
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, type: string}
      responses:
        "200":
          description: OK
  /api/ordens-servico/{id}/servicos:
    post:
      operationId: ordensAdicionarServico
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, type: string}
      responses:
        "200":
          description: OK
  /api/ordens-servico/{id}/pecas:
    post:
      operationId: ordensAdicionarPeca
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, type: string}
      responses:
        "200":
          description: OK

  /actuator/health:
    get:
      operationId: actuatorHealth
      responses:
        "200":
          description: OK
