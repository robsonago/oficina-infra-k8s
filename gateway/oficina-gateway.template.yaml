swagger: "2.0"
info:
  title: oficina-api
  description: >-
    Gateway público da aplicação oficina. Roteia todo o tráfego para o
    backend (aplicação Spring Boot no GKE) preservando o path original.
    A validação do token JWT continua acontecendo na própria aplicação
    (Spring Security); os campos "security" abaixo documentam quais rotas
    exigem token, sem que o gateway valide a assinatura — o esquema atual
    de token (HMAC com chave compartilhada) não é compatível com a
    validação nativa de JWT do API Gateway, que espera um emissor com
    chaves públicas (JWKS).
  version: 1.0.0
schemes:
  - https
produces:
  - application/json
x-google-backend:
  address: https://__BACKEND_HOST__
securityDefinitions:
  bearerAuth:
    type: apiKey
    name: Authorization
    in: header

paths:
  /api/auth/login:
    post:
      operationId: authLogin
      responses:
        "200":
          description: OK
  /api/auth/registrar:
    post:
      operationId: authRegistrar
      responses:
        "200":
          description: OK

  /api/veiculos:
    post:
      operationId: veiculosCriar
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: OK
    get:
      operationId: veiculosListar
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: OK
  /api/veiculos/{id}:
    get:
      operationId: veiculosBuscarPorId
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, type: string}
      responses:
        "200":
          description: OK
    put:
      operationId: veiculosAtualizar
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, type: string}
      responses:
        "200":
          description: OK
    delete:
      operationId: veiculosRemover
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, type: string}
      responses:
        "200":
          description: OK
  /api/veiculos/placa/{placa}:
    get:
      operationId: veiculosBuscarPorPlaca
      security: [{bearerAuth: []}]
      parameters:
        - {name: placa, in: path, required: true, type: string}
      responses:
        "200":
          description: OK
  /api/veiculos/cliente/{clienteId}:
    get:
      operationId: veiculosBuscarPorCliente
      security: [{bearerAuth: []}]
      parameters:
        - {name: clienteId, in: path, required: true, type: string}
      responses:
        "200":
          description: OK

  /api/servicos:
    post:
      operationId: servicosCriar
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: OK
    get:
      operationId: servicosListar
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: OK
  /api/servicos/{id}:
    get:
      operationId: servicosBuscarPorId
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, type: string}
      responses:
        "200":
          description: OK
    put:
      operationId: servicosAtualizar
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, type: string}
      responses:
        "200":
          description: OK
    delete:
      operationId: servicosRemover
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, type: string}
      responses:
        "200":
          description: OK

  /api/pecas:
    post:
      operationId: pecasCriar
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: OK
    get:
      operationId: pecasListar
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: OK
  /api/pecas/{id}:
    get:
      operationId: pecasBuscarPorId
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, type: string}
      responses:
        "200":
          description: OK
    put:
      operationId: pecasAtualizar
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, type: string}
      responses:
        "200":
          description: OK
    delete:
      operationId: pecasRemover
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, type: string}
      responses:
        "200":
          description: OK
  /api/pecas/{id}/estoque:
    patch:
      operationId: pecasAtualizarEstoque
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, type: string}
      responses:
        "200":
          description: OK

  /api/clientes:
    post:
      operationId: clientesCriar
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: OK
    get:
      operationId: clientesListar
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: OK
  /api/clientes/{id}:
    get:
      operationId: clientesBuscarPorId
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, type: string}
      responses:
        "200":
          description: OK
    put:
      operationId: clientesAtualizar
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, type: string}
      responses:
        "200":
          description: OK
    delete:
      operationId: clientesRemover
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, type: string}
      responses:
        "200":
          description: OK
  /api/clientes/documento/{documento}:
    get:
      operationId: clientesBuscarPorDocumento
      security: [{bearerAuth: []}]
      parameters:
        - {name: documento, in: path, required: true, type: string}
      responses:
        "200":
          description: OK

  /api/ordens-servico:
    post:
      operationId: ordensCriar
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: OK
    get:
      operationId: ordensListar
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: OK
  /api/ordens-servico/ativas:
    get:
      operationId: ordensListarAtivas
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: OK
  /api/ordens-servico/estatisticas:
    get:
      operationId: ordensEstatisticas
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: OK
  /api/ordens-servico/status/{status}:
    get:
      operationId: ordensBuscarPorStatus
      security: [{bearerAuth: []}]
      parameters:
        - {name: status, in: path, required: true, type: string}
      responses:
        "200":
          description: OK
  /api/ordens-servico/{id}:
    get:
      operationId: ordensBuscarPorId
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, type: string}
      responses:
        "200":
          description: OK
  /api/ordens-servico/{id}/status:
    get:
      operationId: ordensConsultarStatus
      parameters:
        - {name: id, in: path, required: true, type: string}
      responses:
        "200":
          description: OK
  /api/ordens-servico/{id}/iniciar-diagnostico:
    post:
      operationId: ordensIniciarDiagnostico
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, type: string}
      responses:
        "200":
          description: OK
  /api/ordens-servico/{id}/gerar-orcamento:
    post:
      operationId: ordensGerarOrcamento
