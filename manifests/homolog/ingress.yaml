# Porta de entrada HTTPS do cluster (atrás do API Gateway). Cada microsserviço
# recebe os prefixos que são dele; o resto (cadastros, OS, auth) vai para o
# OS Service. Os Deployments/Services de cada serviço ficam no próprio
# repositório (pasta k8s/) e são aplicados pelo pipeline de cada um.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oficina-app-ingress
  namespace: oficina-homolog
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: "oficina-homolog-ip"
    networking.gke.io/managed-certificates: "oficina-app-cert"
spec:
  defaultBackend:
    service:
      name: oficina-app
      port:
        number: 80
  rules:
    - http:
        paths:
          - path: /api/orcamentos
            pathType: Prefix
            backend:
              service:
                name: oficina-billing
                port:
                  number: 80
          - path: /api/pagamentos
            pathType: Prefix
            backend:
              service:
                name: oficina-billing
                port:
                  number: 80
          - path: /billing
            pathType: Prefix
            backend:
              service:
                name: oficina-billing
                port:
                  number: 80
          - path: /api/execucoes
            pathType: Prefix
            backend:
              service:
                name: oficina-execution
                port:
                  number: 80
          - path: /execucao
            pathType: Prefix
            backend:
              service:
                name: oficina-execution
                port:
                  number: 80
