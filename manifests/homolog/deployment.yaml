apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-app
  namespace: oficina-homolog
spec:
  replicas: 2
  selector:
    matchLabels:
      app: oficina-app
  template:
    metadata:
      labels:
        app: oficina-app
    spec:
      serviceAccountName: oficina-app
      containers:
        - name: cloud-sql-proxy
          # A instância Cloud SQL não libera nenhuma rede externa; a conexão
          # só é possível por aqui, autenticando via Workload Identity (a
          # service account já está vinculada em oficina-app).
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.25.4
          args:
            - "--structured-logs"
            - "--port=5432"
            - "oficina-501820:southamerica-east1:oficina-postgres"
          securityContext:
            runAsNonRoot: true
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
        - name: oficina-app
          # Tag fixa por enquanto; troca para uma tag específica de homolog
          # quando o pipeline de publicação de imagens por branch existir.
          image: ghcr.io/robsonago/oficina-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: oficina-config
            - secretRef:
                name: oficina-secret
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            failureThreshold: 60
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "384Mi"
            limits:
              cpu: "1000m"
              memory: "640Mi"
