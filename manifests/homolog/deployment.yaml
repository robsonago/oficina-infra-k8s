apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-app
  namespace: oficina-homolog
spec:
  replicas: 2
  selector:
    matchLabels:
      app: oficina-app
  template:
    metadata:
      labels:
        app: oficina-app
    spec:
      serviceAccountName: oficina-app
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: oficina-app
          # TODO(Parte 8): trocar para uma tag específica de homolog assim que
          # o pipeline de CI/CD do oficina-app publicar imagens por branch.
          image: ghcr.io/robsonago/oficina-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: oficina-config
            - secretRef:
                name: oficina-secret
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            failureThreshold: 60
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "384Mi"
            limits:
              cpu: "1000m"
              memory: "640Mi"
