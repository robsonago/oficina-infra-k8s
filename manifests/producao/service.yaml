apiVersion: v1
kind: Service
metadata:
  name: oficina-app
  namespace: oficina-producao
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/actuator/prometheus"
spec:
  selector:
    app: oficina-app
  ports:
    - port: 80
      targetPort: 8080
  # ClusterIP: o tráfego externo entra pelo Ingress (GCLB), não diretamente
  # pelo Service. O GKE cria os Network Endpoint Groups automaticamente
  # (container-native load balancing) para o Ingress apontar aqui.
  type: ClusterIP
